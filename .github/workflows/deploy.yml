name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA from a successful release
        required: true
        type: string
      release_run_id:
        description: GitHub Actions run ID that produced the release artifact
        required: true
        type: string

concurrency:
  group: trading-agent-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/trading-agent' }}
    steps:
      - name: Validate deployment inputs
        run: |
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          case "$RELEASE_RUN_ID" in
            *[!0-9]*|'') exit 2 ;;
          esac
          case "$DEPLOY_USER" in
            *[!A-Za-z0-9._-]*|'') exit 2 ;;
          esac
          case "$DEPLOY_HOST" in
            *[!A-Za-z0-9.:-]*|'') exit 2 ;;
          esac
          case "$DEPLOY_PATH" in
            /*) ;;
            *) exit 2 ;;
          esac
          case "$DEPLOY_PATH" in
            *[!A-Za-z0-9._/-]*) exit 2 ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download exact release artifact
        uses: actions/download-artifact@v5
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/release-artifact
          run-id: ${{ env.RELEASE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate immutable release manifest
        run: >-
          python3 ops/release/release_manifest.py validate
          --path "$RUNNER_TEMP/release-artifact/release.env"
          --image-prefix "$IMAGE_PREFIX"
          --release-sha "$RELEASE_SHA"

      - name: Assemble deployment bundle
        run: |
          bundle="$RUNNER_TEMP/deploy-bundle"
          mkdir -p "$bundle/ops/release" "$bundle/db"
          cp "$RUNNER_TEMP/release-artifact/release.env" "$bundle/release.env"
          cp ops/release/compose.production.yml "$bundle/ops/release/"
          cp ops/release/deploy.sh "$bundle/ops/release/"
          cp ops/release/release_manifest.py "$bundle/ops/release/"
          cp ops/release/runtime_profiles.py "$bundle/ops/release/"
          cp ops/release/runtime_secrets.py "$bundle/ops/release/"
          cp db/migrate.sh "$bundle/db/"
          cp -R db/init db/migrations "$bundle/db/"

      - name: Configure pinned SSH host identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release bundle
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          release_path="$DEPLOY_PATH/releases/$RELEASE_SHA"
          ssh "$remote" "mkdir -p -- '$release_path'"
          scp -r "$RUNNER_TEMP/deploy-bundle/." "$remote:$release_path/"

      - name: Deploy with automatic compatible rollback
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          script="$DEPLOY_PATH/releases/$RELEASE_SHA/ops/release/deploy.sh"
          ssh "$remote" \
            "sh '$script' '$DEPLOY_PATH' '$RELEASE_SHA' '$IMAGE_PREFIX'"
