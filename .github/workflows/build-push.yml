name: Build immutable release

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push agent
        id: agent
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/agent:${{ env.RELEASE_SHA }}

      - name: Attest agent provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/agent
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true

      - name: Build and push dashboard
        id: dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/dashboard:${{ env.RELEASE_SHA }}

      - name: Attest dashboard provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/dashboard
          subject-digest: ${{ steps.dashboard.outputs.digest }}
          push-to-registry: true

      - name: Create immutable release manifest
        env:
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: >-
          python3 ops/release/release_manifest.py create
          --path "$RUNNER_TEMP/release/release.env"
          --release-sha "$RELEASE_SHA"
          --agent-image "$IMAGE_PREFIX/agent@$AGENT_DIGEST"
          --dashboard-image "$IMAGE_PREFIX/dashboard@$DASHBOARD_DIGEST"
          --schema-min 44
          --schema-max 44
          --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/release/release.env
          if-no-files-found: error
          retention-days: 90
